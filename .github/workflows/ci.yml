name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Import rule and no-Pygame rule
        run: python .github/scripts/check_imports.py
